<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - SportsHub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">SportsHub</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Sports</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>
  <main>
    <div class="page-content"><h2>Contact Us</h2><p>Send us a message and we'll get back to you.</p></div>
    <form class="contact-form" action="#" method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button type="submit" class="btn-more">Send</button>
    </form>
  </main>
  <footer><p>&copy; 2026 SportsHub. All rights reserved.</p></footer>
</body>
</html>
